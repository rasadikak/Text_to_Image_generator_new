<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Image Generator</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #eee;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
            width: 500px;
            

        }
        h2 {
            font-family: Arial, sans-serif;
            margin-bottom: 10px;
            color: black;
        }
        textarea {
            width: 100%;
            height: 80px;
            resize: none;
            font-size: 16px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: blue;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Text to Image Generator</h2>
        <form action="/" method="post" id="imgForm">
        <textarea placeholder="Enter text to generate image" name="prompt" required></textarea>
        <br>
        <input type="submit" value="Generate Image" class="button">
    </form>

    <div id="result" class="result">
    {% if image_url %}
    <h4>The Generatod Image for the prompt "{{prompt}}"</h4>
    <img src="{{image_url}}" alt="image" width="500px" height="500px" style="display: block; margin: auto; justify-content: center;" >
    {% elif error_msg %}
    <p  style="color:red">{{error_msg}}</p>
    {%endif%}

    </div>
    </div>

    <script>

        
    window.addEventListener("load", function(){
        if(sessionStorage.getItem("submitted")){
            // came from form submit — show result
            sessionStorage.removeItem("submitted");
        } else {
            // user refreshed — hide result and reset form
            document.querySelector(".result").style.display = "none";
            document.getElementById("imgForm").reset();
        }
    });

    document.getElementById("imgForm").addEventListener("submit", function(){
        sessionStorage.setItem("submitted", "true");
    });
</script>


</body>
</html>
